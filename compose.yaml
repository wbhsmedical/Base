# OpenWebUI is the only UI. Gateway holds OPENROUTER_API_KEY.
services:
  gateway:
    build: .
    ports:
      - "8000:8000"
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_FAVORITES: ${OPENROUTER_FAVORITES:-anthropic/claude-opus-5,z-ai/glm-5.3,moonshotai/kimi-k3,deepseek/deepseek-chat,google/gemini-2.0-flash-001}
      PIPELINE_MODEL: ${PIPELINE_MODEL:-deepseek/deepseek-chat}
      HOST: 0.0.0.0
      PORT: "8000"
      BASE_DATA: /app/data/jobs
    volumes:
      - jobdata:/app/data

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "8080:8080"
    environment:
      ENABLE_OLLAMA_API: "false"
      OPENAI_API_BASE_URL: http://gateway:8000/v1
      OPENAI_API_KEY: ${OPENROUTER_API_KEY:-sk-gateway}
      WEBUI_AUTH: ${WEBUI_AUTH:-true}
      WEBUI_NAME: Base
    depends_on:
      - gateway
    volumes:
      - openwebui:/app/backend/data

volumes:
  jobdata:
  openwebui:
